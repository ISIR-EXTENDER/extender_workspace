[project]
name = "extender-workspace"
version = "0.0.0"
requires-python = ">=3.10"
dependencies = [
  # Tablet interface gateway (FastAPI + WS)
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "pydantic>=2.6",
  "pyyaml>=6.0",
  "websockets>=12",
  "empy>=3.3.4,<4",
  "catkin-pkg>=1.1.0",
  "lark>=1.3.1",
]

[project.optional-dependencies]
dev = [
  "ruff>=0.4",
  "pytest>=8",
  "pytest-asyncio>=0.23",
]

vision = [
  # MediaPipe-based packages (hand landmarks)
  "mediapipe>=0.10",
  "numpy>=1.24",
]

ros-build = [
  "empy>=3.3.4,<4",
  "catkin_pkg>=0.5",
  "lark>=1.1",
]

[tool.ruff]
line-length = 100
target-version = "py310"
